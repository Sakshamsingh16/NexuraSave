
name: Build Nexura Save APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NexuraSave-Android-Source.zip'
      - '.github/workflows/build-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir extracted
          unzip -o NexuraSave-Android-Source.zip -d extracted
          test -f extracted/NexuraSave/app/build.gradle.kts

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: |
          gradle --no-daemon \
            -p extracted/NexuraSave assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexuraSave-debug-apk
          path: extracted/NexuraSave/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
